name: Arach HWD validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: git diff --check

  scanner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --locked -- scan --sysfs /sys > /tmp/arach-hwd-inventory.toml
      - run: grep -Fxq 'schema = 4' /tmp/arach-hwd-inventory.toml
      - run: cargo run --locked -- preflight --sysfs /sys --allow-unresolved --output /tmp/arach-hwd-preflight.toml
      - run: grep -Fxq 'schema = 5' /tmp/arach-hwd-preflight.toml

  fortran:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --features fortran-ranking

  idris-agda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y build-essential chezscheme libgmp-dev xz-utils curl
      - uses: actions/cache@v6
        with:
          path: target/formal/toolchains
          key: arach-hwd-formal-idris2-0.8.0-agda-2.8.0-v1
      - run: scripts/bootstrap-formal-toolchains.sh
      - run: scripts/check-formal-models.sh
