name: Remote catalog release validation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.head_ref == 'remote-catalog'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: remote-catalog
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Make catalog fixtures parallel-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/catalog.rs")
          text = path.read_text(encoding="utf-8")
          old_import = "    use std::time::{SystemTime, UNIX_EPOCH};\n"
          new_import = (
              "    use std::sync::atomic::{AtomicU64, Ordering};\n"
              "    use std::time::{SystemTime, UNIX_EPOCH};\n\n"
              "    static SCRATCH_SERIAL: AtomicU64 = AtomicU64::new(1);\n"
          )
          old_name = (
              '            "arach-catalog-{}-{}",\n'
              "            std::process::id(),\n"
              "            SystemTime::now()\n"
              "                .duration_since(UNIX_EPOCH)\n"
              "                .unwrap()\n"
              "                .as_nanos()\n"
          )
          new_name = (
              '            "arach-catalog-{}-{}-{}",\n'
              "            std::process::id(),\n"
              "            SystemTime::now()\n"
              "                .duration_since(UNIX_EPOCH)\n"
              "                .unwrap()\n"
              "                .as_nanos(),\n"
              "            SCRATCH_SERIAL.fetch_add(1, Ordering::Relaxed)\n"
          )
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif "static SCRATCH_SERIAL" not in text:
              raise SystemExit("catalog test import pattern changed")
          if old_name in text:
              text = text.replace(old_name, new_name, 1)
          elif "SCRATCH_SERIAL.fetch_add" not in text:
              raise SystemExit("catalog scratch pattern changed")
          path.write_text(text, encoding="utf-8")
          PY
      - run: cargo fmt --all
      - run: cargo check --locked --all-targets
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --features fortran-ranking
      - run: git diff --check
      - name: Publish verified sources
        run: |
          git rm .github/workflows/release-format.yml
          git config user.name "SisyphusAeolides"
          git config user.email "SisyphusAeolides@users.noreply.github.com"
          git add -A
          git commit -m "Format remote catalog sources"
          git push origin HEAD:remote-catalog
